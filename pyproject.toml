[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nadein-crm"
version = "0.1.0"
description = "Mini CRM for agency leads from Telegram and manual entry"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "aiogram>=3.15,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.setuptools]
packages = ["app", "bot"]
