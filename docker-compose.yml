services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nadein_crm
      POSTGRES_USER: nadein
      POSTGRES_PASSWORD: nadein
    volumes:
      - crm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadein -d nadein_crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nadein:nadein@db:5432/nadein_crm
      PUBLIC_CRM_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: ["python", "-m", "bot.main"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      API_URL: http://api:8000
      PUBLIC_CRM_URL: http://localhost:8000
    depends_on:
      - api
    profiles: ["telegram"]

volumes:
  crm_db:
